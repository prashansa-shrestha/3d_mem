seed: 77
exp_name: "exp_eval_aeqa_smoke"
output_parent_dir: "results/smoke"
scene_dataset_config_path: "data/hm3d/hm3d_annotated_minival_basis.scene_dataset_config.json"
scene_data_path: "data/hm3d"
questions_list_path: "data/aeqa_questions-184.json"
concept_graph_config_path: "cfg/concept_graph_default.yaml"

choose_every_step: true
egocentric_views: true
prefiltering: true
top_k_categories: 10
yolo_model_name: .cache/models/yolov8x-world.pt
sam_model_name: .cache/models/sam_l.pt
sam_autocast: true
class_set: scannet200
min_detection: 1

camera_height: 1.5
camera_tilt_deg: -30
img_width: 1280
img_height: 1280
hfov: 120
save_visualization: false
prompt_h: 360
prompt_w: 360

num_step: 3
init_clearance: 0.3
extra_view_phase_1: 2
extra_view_angle_deg_phase_1: 60
extra_view_phase_2: 6
extra_view_angle_deg_phase_2: 40
explored_depth: 1.7
tsdf_grid_size: 0.1
margin_w_ratio: 0.25
margin_h_ratio: 0.6
planner:
  eps: 1
  max_dist_from_cur_phase_1: 1
  max_dist_from_cur_phase_2: 1
  final_observe_distance: 0.75
  surrounding_explored_radius: 0.7
  frontier_edge_area_min: 4
  frontier_edge_area_max: 6
  frontier_area_min: 8
  frontier_area_max: 9
  min_frontier_area: 20
  max_frontier_angle_range_deg: 150
  region_equal_threshold: 0.95

scene_graph:
  confidence: 0.003
  nms_threshold: 0.1
  iou_threshold: 0.5
  obj_include_dist: 3.5
  target_obj_iou_threshold: 0.6
